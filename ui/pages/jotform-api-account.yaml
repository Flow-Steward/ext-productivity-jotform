- component_id: steps_account
  type: markdown
  title: Account
  body: |
    ### Get account

    Get user account details for this Jotform user. Including user account type, avatar URL, name, email, website URL.

    Action id `get_account` · reads only · API: `GET /user`

    Inputs: none.

    ### Get monthly usage

    Get number of form submissions received this month. Also, get number of SSL form submissions, payment form submissions and upload space used by user.

    Action id `get_monthly_usage` · reads only · API: `GET /user/usage`

    Inputs: none.

    ### Get sub-user accounts

    Get a list of sub users for this accounts and list of forms and form folders with access privileges.

    Action id `get_sub_user_accounts` · reads only · API: `GET /user/subusers`

    Inputs: none.

    ### Get account settings

    Get user's time zone and language.

    Action id `get_account_settings` · reads only · API: `GET /user/settings`

    Inputs: none.

    ### Get account history

    User activity log about things like forms created/modified/deleted, account logins and other operations.

    Action id `get_account_history` · reads only · API: `GET /user/history`

    Inputs: `action`, `date`, `sort_by`, `start_date`, `end_date`.

    ### Get plan details

    Get limit and prices of a plan.

    Action id `get_plan_details` · reads only · API: `GET /system/plan/{planName}`

    Inputs: `plan_name` (required).

    ### Update account settings

    Update user's settings like time zone and language.

    Action id `update_account_settings` · changes data in Jotform · API: `POST /user/settings`

    Inputs: `name`, `email`, `website`, `time_zone`, `company`, `security_question`, `security_answer`, `industry`.
