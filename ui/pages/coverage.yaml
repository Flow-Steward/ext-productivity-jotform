- component_id: coverage_summary
  type: markdown
  title: Coverage
  body: |
    The Jotform API documentation (https://api.jotform.com/docs/) loads its list of operations from a script (downloaded 2026-11-20, SHA-256 `ded079d796ec…`). It lists 56 operations; **52 of them have their own step**.

    - **24 reads** and **28 changes**. Every change is an external effect for Flow Steward, so test runs never send it.
    - Left out:
      - `POST /user/login`: Signing in.
      - `GET /user/logout`: Signing out.
      - `GET /user/labels`: Contradicting facts.
      - `POST /folder`: Contradicting facts.

    The everyday steps on top: test the connection, check readiness, build a support report, list forms, describe a form's questions, read new submissions since a moment, read one submission, create a submission, download an uploaded file, and list, add and remove webhooks.
