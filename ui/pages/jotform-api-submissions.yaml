components:
- component_id: steps_submissions_and_webhooks
  type: markdown
  title: Submissions and webhooks
  body: |
    ### Get form submissions

    List of form responses. answers array has the submitted data. Created_at is the date of the submission. Pages with offset and limit; result_set says what the page holds.

    Action id `get_form_submissions` · reads only · API: `GET /form/{id}/submissions`

    Inputs: `id` (required), `offset`, `limit`, `filter`, `orderby`.

    ### Get submissions of all forms

    Get a list of all submissions for all forms on this account. The answers array has the submission data. Created_at is the date of the submission. Pages with offset and limit; result_set says what the page holds.

    Action id `get_submissions_of_all_forms` · reads only · API: `GET /user/submissions`

    Inputs: `offset`, `limit`, `filter`, `orderby`.

    ### Get submission

    Similar to /form/{form-id}/submissions. But only get a single submission.

    Action id `get_submission` · reads only · API: `GET /submission/{id}`

    Inputs: `id` (required).

    ### Get form webhooks

    Webhooks can be used to send form submission data as an instant notification. Returns list of webhooks for this form.

    Action id `get_form_webhooks` · reads only · API: `GET /form/{id}/webhooks`

    Inputs: `id` (required).

    ### Add submission to form

    Submit data to this form using the API. You should get a list of question IDs from form/{id}/questions and send the submission data with qid. submission is an object: each key becomes the form field submission[key] (nested objects submission[key][part]).

    Action id `add_submission_to_form` · changes data in Jotform · API: `POST /form/{id}/submissions`

    Inputs: `id` (required), `submission` (required).

    ### Add submissions to form

    Submit data to this form using the API. You should get a list of question IDs from form/{id}/questions and send the submission data with qid. submission is the JSON list the documentation shows.

    Action id `add_submissions_to_form` · changes data in Jotform · API: `PUT /form/{id}/submissions`

    Inputs: `id` (required), `submission` (required).

    ### Edit submission

    Edit a single submission. submission is an object: each key becomes the form field submission[key] (nested objects submission[key][part]).

    Action id `edit_submission` · changes data in Jotform · API: `POST /submission/{id}`

    Inputs: `id` (required), `submission`.

    ### Add form webhook

    Webhooks can be used to send form submission data as an instant notification.

    Action id `add_form_webhook` · changes data in Jotform · API: `POST /form/{id}/webhooks`

    Inputs: `id` (required), `webhook_url` (required).

    ### Delete submission

    Delete a single submission.

    Action id `delete_submission` · changes data in Jotform · API: `DELETE /submission/{id}`

    Inputs: `id` (required).

    ### Delete form webhook

    Delete a webhook of a specific form.

    Action id `delete_form_webhook` · changes data in Jotform · API: `DELETE /form/{id}/webhooks/{whid}`

    Inputs: `id` (required), `webhook_id` (required).
