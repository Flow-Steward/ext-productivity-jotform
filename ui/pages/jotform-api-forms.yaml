components:
- component_id: steps_forms_and_questions
  type: markdown
  title: Forms and questions
  body: |
    ### Get forms

    Get a list of forms for this account. Includes basic details such as title of the form, when it was created, number of new and total submissions. Pages with offset and limit; result_set says what the page holds.

    Action id `get_forms` · reads only · API: `GET /user/forms`

    Inputs: `offset`, `limit`, `filter`, `orderby`.

    ### Get form

    Get basic information about a form. Use /form/{id}/questions to get the list of questions.

    Action id `get_form` · reads only · API: `GET /form/{id}`

    Inputs: `id` (required).

    ### Get form questions

    Get a list of all questions on a form. Type describes question field type. Order is the question order in the form. Text field is the question label.

    Action id `get_form_questions` · reads only · API: `GET /form/{id}/questions`

    Inputs: `id` (required).

    ### Get form question

    Form questions might have various properties. Examples: Is it required? Are there any validations such as 'numeric only'?

    Action id `get_form_question` · reads only · API: `GET /form/{id}/question/{qid}`

    Inputs: `id` (required), `qid` (required).

    ### Get form properties

    Get a list of all properties on a form.

    Action id `get_form_properties` · reads only · API: `GET /form/{id}/properties`

    Inputs: `id` (required).

    ### Get form property

    Get a specific property of the form.

    Action id `get_form_property` · reads only · API: `GET /form/{id}/properties/{key}`

    Inputs: `id` (required), `key` (required).

    ### Get form uploads

    List of files uploaded on a form. Here is how you can access a particular file: https://www.jotform.com/uploads/{username}/{form-id}/{submission-id}/{file-name}. Size and file type is also included.

    Action id `get_form_uploads` · reads only · API: `GET /form/{id}/files`

    Inputs: `id` (required).

    ### Create form in account

    Create new forms with questions, properties and email settings. questions is an object: each key becomes the form field questions[key] (nested objects questions[key][part]). properties is an object: each key becomes the form field properties[key] (nested objects properties[key][part]). emails is an object: each key becomes the form field emails[key] (nested objects emails[key][part]).

    Action id `create_form_in_account` · changes data in Jotform · API: `POST /user/forms`

    Inputs: `questions` (required), `properties` (required), `emails`.

    ### Create form

    Create new forms with questions, properties and email settings. questions is an object: each key becomes the form field questions[key] (nested objects questions[key][part]). properties is an object: each key becomes the form field properties[key] (nested objects properties[key][part]). emails is an object: each key becomes the form field emails[key] (nested objects emails[key][part]).

    Action id `create_form` · changes data in Jotform · API: `POST /form`

    Inputs: `questions` (required), `properties` (required), `emails`.

    ### Create forms in account from JSON

    Create new forms with questions, properties and email settings. form_content is the JSON object the documentation shows.

    Action id `create_forms_in_account_from_json` · changes data in Jotform · API: `PUT /user/forms`

    Inputs: `form_content` (required).

    ### Create forms from JSON

    Create new forms with questions, properties and email settings. form_content is the JSON object the documentation shows.

    Action id `create_forms_from_json` · changes data in Jotform · API: `PUT /form`

    Inputs: `form_content` (required).

    ### Clone form

    Clone a single form.

    Action id `clone_form` · changes data in Jotform · API: `POST /form/{id}/clone`

    Inputs: `id` (required).

    ### Add question to form

    Add new question to specified form. Form questions might have various properties. Examples: Is it required? Are there any validations such as 'numeric only'? question is an object: each key becomes the form field question[key] (nested objects question[key][part]).

    Action id `add_question_to_form` · changes data in Jotform · API: `POST /form/{id}/questions`

    Inputs: `id` (required), `question` (required).

    ### Add questions to form

    Add new questions to specified form. Form questions might have various properties. Examples: Is it required? Are there any validations such as 'numeric only'? questions is the JSON object the documentation shows.

    Action id `add_questions_to_form` · changes data in Jotform · API: `PUT /form/{id}/questions`

    Inputs: `id` (required), `questions` (required).

    ### Edit form question

    Edit a question property or add a new one. Form questions might have various properties. Examples: Is it required? Are there any validations such as 'numeric only'? question is an object: each key becomes the form field question[key] (nested objects question[key][part]).

    Action id `edit_form_question` · changes data in Jotform · API: `POST /form/{id}/question/{qid}`

    Inputs: `id` (required), `qid` (required), `question`.

    ### Edit form properties

    Edit a form property or add a new one. properties is an object: each key becomes the form field properties[key] (nested objects properties[key][part]).

    Action id `edit_form_properties` · changes data in Jotform · API: `POST /form/{id}/properties`

    Inputs: `id` (required), `properties`.

    ### Edit form properties from JSON

    Edit a form property or add a new one. form_properties is the JSON object the documentation shows.

    Action id `edit_form_properties_from_json` · changes data in Jotform · API: `PUT /form/{id}/properties`

    Inputs: `id` (required), `form_properties` (required).

    ### Delete form question

    Delete a single form question.

    Action id `delete_form_question` · changes data in Jotform · API: `DELETE /form/{id}/question/{qid}`

    Inputs: `id` (required), `qid` (required).

    ### Delete form

    Delete an existing form.

    Action id `delete_form` · changes data in Jotform · API: `DELETE /form/{id}`

    Inputs: `id` (required).
