- component_id: api_overview
  type: markdown
  title: How the steps work
  body: |
    The steps call the Jotform API of the connected account: 64 steps in all, the everyday ones first.

    - **Results.** A generated step returns `status`, `data` (the `content` Jotform returned), `limit_left` (the API calls left today) and `warnings`; a list also `result_set`.
    - **Inputs as documented.** Form fields written `prefix[...]` in the documentation are one object input: `{"1": "Hello"}` under `submission` is sent as `submission[1]=Hello`. JSON parameters are sent as the JSON body.
    - **Confirmed changes.** Jotform confirms a change inside its answer (`responseCode` 200). An answer without it leaves the change unknown: the step says so, and you check Jotform before running it again.
    - **Changes are sent once.** A step that changes data is never retried automatically. Test runs never send changes.
    - **Daily calls.** Jotform counts the API calls of a key per day by plan; every step returns what is left.

    The steps by area:

    - **Forms and questions** (19 steps)
    - **Submissions and webhooks** (10 steps)
    - **Reports, labels and folders** (16 steps)
    - **Account** (7 steps)
- component_id: steps_everyday
  type: markdown
  title: Everyday
  body: |
    ### Test connection

    Checks that Jotform accepts the connection's API key at the connection's region: reads the account. Returns its username, name, plan and the API calls left today.

    Action id `test_connection` · reads only · API: `GET /user`

    Inputs: none.

    Results: `connected`, `region`, `username`, `name`, `account_type`, `status`, `limit_left`, `warnings`.

    ### Check readiness

    Says for every everyday step whether it works with this key and account, and what to set up if not. Reads only.

    Action id `check_readiness` · reads only · API: `GET /user`, `GET /user/usage`, `GET /user/forms`

    Inputs: none.

    Results: `ready`, `steps`, `account`, `warnings`.

    ### Build support report

    Saves a JSON file for a support request: the extension version, the region, the readiness check and the failed step's error. It holds no records and no API key; e-mail addresses and long numbers are masked.

    Action id `build_support_report` · reads only · API: `GET /user`, `GET /user/usage`, `GET /user/forms`

    Inputs: `failed_operation_id`, `failed_error_code`, `failed_error`.

    Results: `file`, `summary`, `support_url`, `warnings`.

    ### List forms

    Reads the account's forms page by page, in the step output or a JSON file: id, title, status, dates and the number of new and all submissions. Filter and order as the documentation describes.

    Action id `list_forms` · reads only · API: `GET /user/forms`

    Inputs: `filter`, `orderby`, `start_offset`, `max_records`, `page_size`, `output`.

    Results: `count`, `complete`, `next_offset`, `page_size`, `forms`, `file`, `limit_left`, `warnings`.

    ### Describe form questions

    Lists a form's questions in their order: question id, name, label, type, whether it is required and the names of its parts (first and last of a full name). Create submission takes answers by these question ids.

    Action id `describe_form_questions` · reads only · API: `GET /form/{id}/questions`

    Inputs: `form_id` (required).

    Results: `form_id`, `questions`, `warnings`.

    ### Get form submissions since

    Reads a form's submissions created at or after a moment, and returns where the next run continues: give next_since as since and next_after_ids as after_ids, and each submission comes once. A run that stops early returns next_offset for the same window. Dates are written as Jotform writes them, YYYY-MM-DD HH:MM:SS.

    Action id `get_form_submissions_since` · reads only · API: `GET /form/{id}/submissions`

    Inputs: `form_id` (required), `since`, `after_ids`, `filter`, `start_offset`, `max_records`, `page_size`, `output`.

    Results: `count`, `complete`, `next_since`, `next_after_ids`, `next_offset`, `page_size`, `submissions`, `file`, `limit_left`, `warnings`.

    ### Get submission answers

    Reads one submission: its form, dates, status and its answers in question order, each with the question's label, type, the answer and its formatted text.

    Action id `get_submission_answers` · reads only · API: `GET /submission/{id}`

    Inputs: `submission_id` (required).

    Results: `submission_id`, `form_id`, `created_at`, `updated_at`, `status`, `answers`, `warnings`.

    ### Create submission

    Adds a submission to a form. Answers are given by question id; the step reads the form's questions first and refuses an id the form does not have, before anything is sent (a test run checks the inputs only). It is sent once, never repeated.

    Action id `create_submission` · changes data in Jotform · API: `GET /form/{id}/questions`, `POST /form/{id}/submissions`

    Inputs: `form_id` (required), `answers` (required).

    Results: `submission_id`, `form_id`, `limit_left`, `processing`, `applied`, `check`, `warnings`.

    ### Download submission file

    Saves a file uploaded with a submission as a workflow file. The step finds it in the form's uploads by submission and, when there are several, by file name.

    Action id `download_submission_file` · reads only · API: `GET /form/{id}/files`, `GET the file's jotform.com/uploads address`

    Inputs: `form_id` (required), `submission_id` (required), `file_name`.

    Results: `file`, `file_name`, `content_type`, `size_bytes`, `limit_left`, `warnings`.

    ### List form webhooks

    Lists the addresses a form sends each new submission to, with their ids.

    Action id `list_form_webhooks` · reads only · API: `GET /form/{id}/webhooks`

    Inputs: `form_id` (required).

    Results: `form_id`, `webhooks`, `warnings`.

    ### Add webhook if new

    Makes a form send each new submission to an address, unless it already does. After adding, the list is read once more: an address added twice at the same time is reported, nothing is removed. Run it once at a time for one form.

    Action id `add_webhook_if_new` · changes data in Jotform · API: `GET /form/{id}/webhooks`, `POST /form/{id}/webhooks`

    Inputs: `form_id` (required), `webhook_url` (required).

    Results: `created`, `webhook_id`, `duplicate_detected`, `duplicate_ids`, `limit_left`, `processing`, `applied`, `check`, `warnings`.

    ### Remove webhook

    Stops a form from sending submissions to an address, by its id or address. When the form has no such webhook nothing is sent; an address there more than once needs its id.

    Action id `remove_webhook` · changes data in Jotform · API: `GET /form/{id}/webhooks`, `DELETE /form/{id}/webhooks/{whid}`

    Inputs: `form_id` (required), `webhook_id`, `webhook_url`.

    Results: `removed`, `webhook_id`, `url`, `remaining`, `limit_left`, `processing`, `applied`, `check`, `warnings`.
