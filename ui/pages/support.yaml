page_id: support
title: Support
description: Where to report a problem, ask a question or request a feature.
project_scoped: false
components:
  - component_id: support_contact
    type: markdown
    title: Contact the developers
    body: |
      This extension is maintained in a public GitHub repository. Use it to report a problem, ask a question or request a feature.

      - [Report a problem or request a feature](https://github.com/Flow-Steward/ext-productivity-jotform/issues/new/choose)
      - [Browse existing issues](https://github.com/Flow-Steward/ext-productivity-jotform/issues)
      - [Documentation and source code](https://github.com/Flow-Steward/ext-productivity-jotform)

      Opening an issue needs a GitHub account. Check the existing issues first: someone may already have reported the same problem.
  - component_id: support_report
    type: markdown
    title: What to include in a report
    body: |
      - Run **Build support report** with the failed step's action id, error code and error text, and attach its file. It holds no records and no API key.
      - What you did, what you expected and what happened instead.

      Issues are public. Never include API keys or the data of your forms.
