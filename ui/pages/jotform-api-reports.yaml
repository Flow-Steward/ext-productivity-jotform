title: 'API steps: Reports, labels and folders'
description: The 16 steps for reports, labels and folders.
components:
- component_id: steps_reports_labels_and_folders
  type: markdown
  title: Reports, labels and folders
  body: |
    ### Get form reports

    Get all the reports of a specific form.

    Action id `get_form_reports` · reads only · API: `GET /form/{id}/reports`

    Inputs: `id` (required).

    ### Get reports

    List of URLS for reports in this account. Includes reports for all of the forms. ie. Excel, CSV, printable charts, embeddable HTML tables.

    Action id `get_reports` · reads only · API: `GET /user/reports`

    Inputs: none.

    ### Get report

    Get more information about a data report.

    Action id `get_report` · reads only · API: `GET /report/{id}`

    Inputs: `id` (required).

    ### Get label

    Get the details of a label, including its name and color.

    Action id `get_label` · reads only · API: `GET /label/{id}`

    Inputs: `id` (required).

    ### Get label resources

    Get a list of assets in a label and their associated information.

    Action id `get_label_resources` · reads only · API: `GET /label/{id}/resources`

    Inputs: `id` (required).

    ### Get folders

    Get a list of form folders for this account. Returns name of the folder and owner of the folder for shared folders. Jotform marks this operation as deprecated in favour of the labels.

    Action id `get_folders` · reads only · API: `GET /user/folders`

    Inputs: none.

    ### Get folder

    Get a list of forms in a folder, and other details about the form such as folder color. Jotform marks this operation as deprecated in favour of the labels.

    Action id `get_folder` · reads only · API: `GET /folder/{id}`

    Inputs: `id` (required).

    ### Create form report

    Create new report of a form with intended fields, type and title.

    Action id `create_form_report` · changes data in Jotform · API: `POST /form/{id}/reports`

    Inputs: `id` (required), `title` (required), `list_type` (required), `fields`.

    ### Create label

    Create a label by defining attributes such as name and color.

    Action id `create_label` · changes data in Jotform · API: `POST /label`

    Inputs: `name` (required), `color`, `parent`.

    ### Update label

    Update an existing label with specified parameters, such as name and color.

    Action id `update_label` · changes data in Jotform · API: `PUT /label/{id}`

    Inputs: `id` (required), `property` (required).

    ### Add resources to label

    Add the specified assets, identified by their IDs and types, into a label. resources is the JSON object the documentation shows.

    Action id `add_resources_to_label` · changes data in Jotform · API: `PUT /label/{id}/add-resources`

    Inputs: `id` (required), `resources` (required).

    ### Remove resources from label

    Remove the specified assets, identified by their IDs and types, from a label. resources is the JSON object the documentation shows.

    Action id `remove_resources_from_label` · changes data in Jotform · API: `PUT /label/{id}/remove-resources`

    Inputs: `id` (required), `resources` (required).

    ### Update folder

    Update a folder with specified parameters. Also you can add forms to the folder. Jotform marks this operation as deprecated in favour of the labels. folder_content is the JSON object the documentation shows.

    Action id `update_folder` · changes data in Jotform · API: `PUT /folder/{id}`

    Inputs: `id` (required), `folder_content` (required).

    ### Delete report

    Delete an existing report.

    Action id `delete_report` · changes data in Jotform · API: `DELETE /report/{id}`

    Inputs: `id` (required).

    ### Delete label

    Delete a label along with all its sublabels.

    Action id `delete_label` · changes data in Jotform · API: `DELETE /label/{id}`

    Inputs: `id` (required).

    ### Delete folder

    Delete a folder and its subfolders. Jotform marks this operation as deprecated in favour of the labels.

    Action id `delete_folder` · changes data in Jotform · API: `DELETE /folder/{id}`

    Inputs: `id` (required).
