manifest_version: 2
lifecycle:
  data_schema_version: 1
  data_migrations: []
extension_id: com.brizzl.jotform
kind: tool_provider
version: 0.1.0
release_stage: active
billing_mode: free
display_name: Jotform
description: 'Connect workflows to Jotform, the online form builder, through its REST
  API. Everyday steps list forms and their questions, read a form''s new submissions
  with a cursor that continues where the last run stopped, read one submission, create
  a submission, download an uploaded file and manage a form''s webhooks.


  52 operations of the Jotform API documentation have their own step. A connection
  is one Jotform account''s API key and its region: standard, EU or HIPAA.'
vendor:
  name: Brizzl
  support_url: https://github.com/brizzl/ext-productivity-jotform/issues
  website_url: https://github.com/brizzl/ext-productivity-jotform
listing:
  category: productivity
  tags:
  - jotform
  - forms
  - submissions
  - surveys
  - webhooks
  summary: Read Jotform forms and submissions, create submissions, download uploads
    and manage webhooks.
  categories:
  - productivity
  - data
  setup_summary: "Create an API key in Jotform (My Account \u2192 API), add it and\
    \ the account's region to the connection and run the connection test."
features:
- tool
- action
required_scopes:
- extension:invoke
- artifact:read
- artifact:write
machine_auth:
  service_account_key: svc_ext_jotform
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
account_scope:
  scope_type: project
  description: Each Jotform API key is a project connection; a project may hold several.
egress:
  hosts:
  - api.jotform.com
  - eu-api.jotform.com
  - hipaa-api.jotform.com
  - '*.jotform.com'
